name: retailflow_mobile_pos
description: "RetailFlow POS - Native Android Mobile & Tablet Point of Sale Application"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Icons & Fonts
  google_fonts: ^6.2.1

  # Local Storage & Persistence
  shared_preferences: ^2.2.3
  intl: ^0.20.3
  uuid: ^4.4.0

  # Thermal Printing & PDF Generation
  pdf: ^3.10.8
  printing: ^5.12.0
  share_plus: ^9.0.0

  # Networking & Utilities
  http: ^1.2.1
  path_provider: ^2.1.3
  lucide_icons_flutter: ^3.1.17

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
